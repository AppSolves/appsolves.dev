name: Redesign preview artifact

on:
  push:
    branches: [redesign/portfolio-2026]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/redesign/portfolio-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Match the locked Playwright version. Preinstalled browser dependencies avoid
    # runner apt-mirror outages during review builds.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Validate contact Worker in local Cloudflare runtime
        run: npm run worker:test
      - uses: actions/upload-artifact@v4
        with:
          name: appsolves-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # Render the same production build in Chromium so external reviewers can
      # inspect real pixels without needing access to the developer's localhost.
      - name: Run browser regression and visual captures
        run: npx playwright test
      - name: Upload visual review captures
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: appsolves-visual-review-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
