    <style>html{background:#f5f3ed}html[data-theme=dark]{background:#11120f}</style>
    <script>
      // This client-rendered app needs the theme before its React bundle loads.
      (() => {
        let preference = "system";
        try {
          const stored = localStorage.getItem("appsolves-theme");
          if (["system", "light", "dark"].includes(stored)) preference = stored;
          else if (stored !== null) localStorage.removeItem("appsolves-theme");
        } catch {
          /* Storage can be disabled; the OS preference still applies. */
        }
        const dark =
          preference === "dark" ||
          (preference === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#11120f"
          : "#f5f3ed";
      })();
    </script>
